[project]
name = "customer-mcp-task1"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.30.0",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
